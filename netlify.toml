[build]
  publish = "."

# Force HTTPS
[[redirects]]
  from = "http://ferenckovacs.com/*"
  to = "https://ferenckovacs.com/:splat"
  status = 301
  force = true

# www redirect
[[redirects]]
  from = "http://www.ferenckovacs.com/*"
  to = "https://ferenckovacs.com/:splat"
  status = 301
  force = true

# Edge function forráskód ne legyen statikusan kiszolgálva
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# Custom 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
